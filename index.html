<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlashCard Page</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js" defer></script>

</head>
<body>

    <!-- Input Screen -->
    <section class="taking_input">

        <header>
            <h1>FlashCard Learning</h1>
        </header>

        <h2 class="form_heading">
            Welcome to FlashCard Learning App.
            Select topic and number of questions to proceed.
        </h2>

        <form id="quizForm">

            <div class="inner_form">

                <div class="select_outer">

                    <label for="topic_select">
                        Select Topic:
                    </label>

                    <select
                        name="topics"
                        id="topic_select"
                        required
                    >
                        <option value="">
                            Choose Topic
                        </option>

                        <option value="html">
                            HTML
                        </option>

                        <option value="css">
                            CSS
                        </option>

                        <option value="javascript">
                            JavaScript
                        </option>
                    </select>

                </div>

                <label
                    for="questionCount"
                    class="number_of_ques_para"
                >
                    Enter number of questions:
                </label>

                <input
                    type="number"
                    id="questionCount"
                    placeholder="1-3"
                    min="1"
                    max="3"
                    class="number_of_ques"
                    required
                >

                <input
                    type="submit"
                    value="Generate Questions"
                    class="submit_form"
                    id="sub_btn"
                >

            </div>

        </form>

    </section>


    <!-- Flashcard Screen -->
    <section class="cards" id="cards">

        <h2 class="card_heading">
            Question 1 / 3
        </h2>

        <div class="card_container">

            <div class="card">

                <div class="front">
                    What is HTML?
                </div>

                <div class="back">
                    HTML stands for HyperText Markup Language
                    and is used to structure web pages.
                </div>

            </div>

            <div class="buttons">

                <button class="btn correct_btn">
                    Correct
                </button>

                <button class="btn wrong_btn">
                    Wrong
                </button>

            </div>

        </div>

    </section>


    <!-- Result Screen -->
    <section class="result_screen">

        <h2>
            Quiz Completed 🎉
        </h2>

        <p>
            Your Score:
            <span class="score">
                0 / 3
            </span>
        </p>

        <button class="restart_btn">
            Restart Quiz
        </button>

    </section>

</body>
</html>
